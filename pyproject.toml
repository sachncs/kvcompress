[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvfold"
version = "0.2.0"
description = "Universal plug-and-play KV cache compression for decoder-only LLMs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "sachin", email = "sachncs@gmail.com" }]
keywords = ["kv-cache", "compression", "transformers", "llm", "tucker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.5,<3",
    "transformers>=4.45,<5",
    "typer>=0.12",
    "numpy>=1.26,<3",
    "safetensors>=0.4",
]

[project.optional-dependencies]
vllm = ["vllm>=0.19,<1.0"]
triton = ["triton>=2.2"]
bench = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "datasets>=2.14",
]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "vulture>=2.11",
    "pydocstyle>=6.3",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9",
]
paper = [
    "datasets>=2.14",
    "transformers>=4.45,<5",
]

[project.scripts]
kvfold = "kvfold.cli:app"

[project.urls]
Homepage = "https://github.com/sachncs/kvcompress"
Paper = "https://arxiv.org/abs/2607.12550"
Changelog = "https://github.com/sachncs/kvcompress/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["kvfold*"]
exclude = ["configs*", "tests*", "examples*", "scripts*", "docs*"]

[tool.setuptools.package-data]
"kvfold" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["kvfold", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF",
    "PT", "TID", "ARG", "PL",
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value
    "B008",     # do not call function in default argument
    "UP040",    # TypeAlias syntax is required for Python 3.11 support
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR0915", "N806", "ARG"]
"examples/**/*.py" = ["E402"]
"kvfold/kernel/triton/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = false
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["kvfold"]

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "triton.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vllm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kvfold.adapter.huggingface"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kvfold.kernel.triton.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kvfold.adapter.registry"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kvfold.adapter.vllm"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kvfold.adapter.vllm_offload"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kvfold.bench.*"
ignore_errors = true

# Vulture configuration.
# 80% confidence floor: vulture's 60% findings flag a lot of internal-but-useful
# symbols (lazy-export __getattr__, dataclass field names, subcommands exposed
# elsewhere). We exclude the patterns that consistently produce noise.
[tool.vulture]
min_confidence = 80
paths = ["kvfold"]

[tool.coverage.run]
source = ["kvfold"]
branch = false
omit = [
    # Optional benchmark/research entry points are exercised by their own
    # commands, not the fast unit-test gate.
    "kvfold/bench/*",
    "kvfold/paper/*",
    # Optional deployment backends require vLLM/CUDA and are covered by
    # integration/GPU jobs when those dependencies are available.
    "kvfold/adapter/vllm*",
    "kvfold/kernel/triton/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
omit = [
    "kvfold/bench/*",
    "kvfold/paper/*",
    "kvfold/adapter/vllm*",
    "kvfold/kernel/triton/*",
]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require model downloads",
    "gpu: marks tests that require a CUDA device",
    "mps: marks tests that require an Apple MPS device",
]
filterwarnings = [
    "ignore::DeprecationWarning:transformers.*",
    "ignore::DeprecationWarning:huggingface_hub.*",
    "ignore::FutureWarning:transformers.*",
]
